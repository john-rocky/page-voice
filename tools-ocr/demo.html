<!doctype html>
<meta charset="utf-8">
<title>timeline</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #0a0e12; color: #e7e9ea; min-height: 100vh;
    font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .col { max-width: 640px; margin: 0 auto; border-left: 1px solid #22303c;
    border-right: 1px solid #22303c; min-height: 100vh; }
  .post { padding: 16px 20px; border-bottom: 1px solid #22303c; display: flex; gap: 12px; }
  .av { width: 42px; height: 42px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #0a0e12; }
  .who { color: #71767b; font-size: 14px; }
  .who b { color: #e7e9ea; font-size: 15px; }
  .body { margin-top: 2px; }
  .shot { display: block; width: 100%; margin-top: 10px; border-radius: 14px;
    border: 1px solid #2f3336; }
  .spacer { height: 46vh; display: flex; align-items: center; justify-content: center;
    color: #38444d; border-bottom: 1px solid #22303c; }
</style>
<div class="col">
  <div class="post">
    <div class="av" style="background:#7fd1ae">A</div>
    <div>
      <div class="who"><b>Alex</b> @demo_alex · 40m</div>
      <div class="body">posting a wall of text as an image is a bold move and I respect it</div>
    </div>
  </div>
  <div class="post" id="post-a">
    <div class="av" style="background:#8ab4f8">S</div>
    <div>
      <div class="who"><b>Sam</b> @demo_sam · 1h</div>
      <div class="body">saving this here so I stop losing it in DMs</div>
      <img class="shot" id="shot-a" src="/fixture-en-dark.png" alt="">
    </div>
  </div>
  <div class="post">
    <div class="av" style="background:#f8c471">K</div>
    <div>
      <div class="who"><b>Kim</b> @demo_kim · 2h</div>
      <div class="body">every screenshot in my timeline is a dead end. can't copy, can't search</div>
    </div>
  </div>
  <div class="post" id="post-b">
    <div class="av" style="background:#d98adf">R</div>
    <div>
      <div class="who"><b>Rin</b> @demo_rin · 4h</div>
      <div class="body">same energy</div>
      <img class="shot" id="shot-b" src="/fixture-en-light.png" alt="">
    </div>
  </div>
  <div class="spacer">·</div>
</div>
