<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .tile {
    width: 128px; height: 128px; border-radius: 26px;
    background: linear-gradient(135deg, #ffb02e 0%, #ff6a3d 100%);
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div class="tile">
  <!-- A landscape picture with a T in it: "the text inside the image".
       Amber rather than Page Voice's blue-purple so the two are told apart in
       the toolbar. Two heavy shapes only — scan brackets and multiple text
       lines both turn to mush at 16px, a T stays crisp. -->
  <svg width="98" height="98" viewBox="0 0 24 24" fill="none">
    <rect x="2.6" y="5" width="18.8" height="14" rx="3" fill="#ffffff"/>
    <rect x="6.2" y="8" width="11.6" height="2.9" rx="1.45" fill="#1b2440"/>
    <rect x="10.55" y="8" width="2.9" height="8" rx="1.45" fill="#1b2440"/>
  </svg>
</div>
</body>
</html>
